<!-- ── Main ── -->
<main class="content-wrapper">
  <section class="card fade-in">

    <h1 class="title"><i class="fa-solid fa-book-open"></i> Study Plan</h1>

    <!-- Loading -->
    <div *ngIf="isLoading()" class="loading-hint">
      <i class="fa-solid fa-spinner fa-spin"></i> Loading your study plan...
    </div>

    <!-- Error -->
    <div *ngIf="errorMessage()" class="alert error">
      <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage() }}
    </div>

    <!-- Content -->
    <ng-container *ngIf="studyPlan() as plan">

      <p class="ordering">
        <strong>Ordering:</strong> {{ plan.ordering }}
      </p>

      <!-- Tabella corsi -->
      <div class="table-container">
        <table class="styled-table">
          <thead>
            <tr>
              <th>Year</th>
              <th>Degree Course</th>
              <th>Course</th>
              <th>Type</th>
              <th>CFU</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let course of plan.courses">
              <td>{{ course.yearOfStudy }}°</td>
              <td>{{ course.degreeCourse }}</td>
              <td>{{ course.name }}
                <span class="badge-core" *ngIf="course.mandatoryCourse" title="Mandatory course">
                <i class="fa-solid fa-lock"></i>
                </span>
              </td>
              <td>
                <span class="badge-type" [ngClass]="course.type.toLowerCase()">
                  {{ course.type }}
                </span>
              </td>
              <td><strong>{{ course.cfu }}</strong></td>
            </tr>
          </tbody>
          <tfoot>
            <tr class="total-row">
              <td colspan="4"><strong>Total CFU</strong></td>
              <td><strong>{{ totalCfu() }}</strong></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Actions -->
      <div class="actions">
        <a routerLink="/study_plan/change" class="btn btn-primary">
          <i class="fa-solid fa-pen"></i> Modify
        </a>
        <a routerLink="/user_student/student-home" class="btn btn-secondary">
          <i class="fa-solid fa-house"></i> Back to Home
        </a>
      </div>

    </ng-container>

  </section>
</main>
