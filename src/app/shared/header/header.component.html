<header class="main-header">
  <div class="header-inner">

    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="3" width="20" height="6" rx="1.5" fill="#2563eb"/>
        <rect x="2" y="13" width="20" height="8" rx="2" fill="#1e40af"/>
      </svg>
      <h1 class="brand">UNI JOURNEY</h1>
    </div>

    <button
      class="theme-toggle"
      type="button"
      title="Toggle theme"
      (click)="toggleTheme()">
      <i class="fas" [ngClass]="darkMode ? 'fa-sun' : 'fa-moon'"></i>
    </button>

  </div>
</header>
