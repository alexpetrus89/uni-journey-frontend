<main class="pw-wrapper">
  <div class="pw-card">

    <h2><i class="fa-solid fa-lock-open"></i> Forgot Password</h2>
    <p class="subtitle">We'll send you a reset link</p>

    <!-- Alert errore -->
    <div *ngIf="errorMessage" class="alert error">
      <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
    </div>

    <!-- Alert successo -->
    <div *ngIf="successMessage" class="alert success">
      <i class="fa-solid fa-circle-check"></i> {{ successMessage }}
    </div>

    <!-- Form visibile finché non c'è successo -->
    <form *ngIf="!successMessage" (ngSubmit)="requestReset()">
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <button class="btn primary" type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Send reset link</span>
        <span *ngIf="isLoading"><i class="fa-solid fa-spinner fa-spin"></i> Sending...</span>
      </button>
    </form>

    <p class="links">
      Remembered it? <a routerLink="/login">Back to login</a>
    </p>

    <a routerLink="/" class="home-link">
      <i class="fa-solid fa-house"></i> Back to home
    </a>

  </div>
</main>
