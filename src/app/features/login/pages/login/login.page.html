<main class="login-wrapper">
  <div class="login-card">

    <h2><i class="fa-solid fa-right-to-bracket"></i> Sign in</h2>
    <p class="subtitle">Enter your personal space</p>

    <div *ngIf="errorMessage" class="alert error">
      {{ errorMessage }}
    </div>

    <div class="greeting-message visible">
      {{ greeting }}
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" autocomplete="current-password" required/>
      </div>
      <button class="btn primary" type="submit">Login</button>
    </form>

    <div class="divider"><span>Or</span></div>

    <div class="social-login">
      <button class="btn social google" type="submit" (click)="loginWithGoogle()">
          <i class="fab fa-google"></i> Google
      </button>
      <button class="btn social github" type="submit" (click)="loginWithGithub()">
        <i class="fab fa-github"></i>GitHub
      </button>
    </div>

    <p class="links">
      New user? <a routerLink="/registration">Registration</a><br />
      Forgot password? <a routerLink="/forgot-password">Recover</a>
    </p>

    <a routerLink="/" class="home-link">
      <i class="fa-solid fa-house"></i>
      Back to home
    </a>

  </div>
</main>
